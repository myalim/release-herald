# 릴리스 요약 갱신 — 매일 원문을 받아 새 버전만 판정하고 data/summaries.json 에 병합한다.
#
# 결정적인 일(추출·추림·병합·검증)은 스크립트가, 판정만 액션이 한다. 그래서 액션에 주는 도구가
# 파일 읽기·쓰기뿐이고, 커밋은 이 워크플로가 직접 한다.
#
# 트리거를 늘릴 때 주의 — 액션이 받는 이벤트는 정해져 있다(schedule · workflow_dispatch ·
# repository_dispatch · workflow_run 과 PR·issue 계열). push 는 목록에 없어 `Unsupported event
# type` 으로 죽고, 그 넷이 전부 default 브랜치에서만 발화하므로 **작업 브랜치에서는 돌릴 수 없다.**
name: summarize

on:
  schedule:
    # 22:00 UTC = 07:00 KST. 오너가 아침에 세션을 켤 때 이미 갱신돼 있게 둔다.
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 수동 실행과 cron 이 겹치면 같은 대기분을 두 번 판정해 사용량을 두 배로 쓰고, 뒤 실행의
# push 가 non-fast-forward 로 거부돼 실제 생성 실패와 구분되지 않는 빨간 run 이 남는다.
concurrency:
  group: summarize
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Extract source items
        run: python3 scripts/build.py extract

      # 이미 판정된 버전은 다시 묻지 않는다 — 재현성과 사용량 양쪽에 걸린다.
      - name: Collect unjudged releases
        id: pending
        run: python3 scripts/build.py pending

      # 대기가 없으면 아래 전부를 건너뛴다. 빈 판정을 묻는 것은 사용량만 쓰고 아무것도 바꾸지 않는다.
      - name: Classify and translate
        if: steps.pending.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: 'prompts/classify.md 를 읽고 거기 적힌 지시를 그대로 수행한다.'
          claude_args: |
            --model claude-opus-5
            --allowedTools "Read,Write"
            --max-turns 30

      # 병합이 판정 결과를 pending 과 대조해 통과분만 넣고, 어긋난 릴리스는 거부 수로 돌려준다.
      # 그 신호는 커밋을 마친 뒤에 쓴다 — 통과분까지 함께 버리지 않기 위해서다.
      - name: Merge and validate
        id: merge
        if: steps.pending.outputs.count != '0'
        run: |
          python3 scripts/build.py merge
          python3 scripts/build.py validate data/summaries.json

      - name: Commit
        if: steps.pending.outputs.count != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/summaries.json
          git diff --cached --quiet || git commit -m 'chore: 릴리스 요약 갱신'
          # 겹친 실행이 먼저 밀어 넣었을 수 있다 — 거부되면 이 실행의 판정이 통째로 버려진다.
          git pull --rebase
          git push

      # 거부된 릴리스가 있으면 여기서 실패로 끝낸다. 통과분은 이미 들어갔고, 실패한 run 이
      # 저자에게 가는 유일한 신호다 — 사용자 화면의 침묵과 저자의 관측은 분리한다.
      - name: Fail on rejected releases
        if: steps.merge.outputs.rejected != '' && steps.merge.outputs.rejected != '0'
        run: |
          echo "판정이 거부된 릴리스가 있다 — 위 Merge 단계 로그를 볼 것" >&2
          exit 1
