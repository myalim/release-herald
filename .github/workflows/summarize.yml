# 릴리스 요약 갱신 — 원문을 받아 새 버전만 판정해 data/summaries.json 에 병합하고, 영역이 없는 릴리스에
# 영역을 붙인다.
#
# 결정적인 일(추출·추림·병합·검증)은 스크립트가, 판정만 claude CLI 가 한다. 그래서 CLI 에 주는
# 도구가 파일 읽기·쓰기뿐이고(제한은 `--disallowedTools` 가 건다), 커밋은 이 워크플로가 직접 한다.
#
# 공식 액션이 아니라 CLI 를 직접 설치해 돌리는 이유는 둘이다 —
# 액션은 워크플로 파일이 default 브랜치와 한 글자도 다르지 않아야 돌아서, 워크플로를 고칠 때마다
# "검증하려면 병합, 병합하려면 검증" 이 된다. 그리고 그렇게 건너뛴 실행을 `outcome=success` 로
# 끝내 화면에서 초록으로 보인다. 정작 액션이 주는 것(PR 코멘트·트리거 감지)은 여기서 하나도 안 쓴다.
#
# 트리거 제약은 이제 하나뿐이다 — `schedule` 은 default 브랜치에서만 발화한다(GitHub 제약).
# `workflow_dispatch` 는 어느 브랜치에서나 도므로 병합 전 검증은 그쪽으로 한다:
#   gh workflow run summarize --ref <브랜치>
name: summarize

on:
  schedule:
    # 3시간마다 폴링한다. **소스 저장소의 릴리스를 이벤트로 받을 방법이 없어서다** — `on: release`
    # 는 자기 저장소만 보고, `repository_dispatch`·webhook 은 상대 저장소의 설정 권한을 요구한다.
    # 감지가 곧 폴링이라 남는 손잡이는 주기뿐이다.
    #
    # 하루 한 번(22:00 UTC)이었을 때는 **판정 창이 게시 창 한복판에 놓여 있었다** — cron 지연까지
    # 더한 실제 시작이 릴리스가 주로 게시되는 시간대 안에 들어가, 게시가 그 run 직후면 판정이
    # 하루를 통째로 밀렸다(2026-09-06 관측).
    #
    # 주기를 좁힐 수 있는 것은 **헛도는 실행이 싸기 때문이다** — 판정 대기와 영역 없는 릴리스가
    # 둘 다 0이면 CLI 를 내려받지도 않고 10초에 끝난다. 영역을 채우는 동안은 실행마다 영역 판정을
    # 상한만큼 묻는다(아래 Collect untagged releases). 놓쳐도 유실은 없다(atom 이 9일 창) — 이건
    # 지연 문제지 누락 문제가 아니다.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      # 경보는 실제로 멈춰야만 밟히는 경로라, 감시 job 이 실패를 본 것처럼 만들어 이슈 생성과
      # 멘션 알림 도달을 확인한다. 예약 실행에는 입력이 없어 항상 실제 결과를 본다.
      simulate:
        description: 감시 job 에 실패를 흉내 낸다 (경보 경로 확인용)
        type: choice
        options: [none, failure]
        default: none

permissions:
  contents: write

# 수동 실행과 cron 이 겹치면 같은 대기분을 두 번 판정해 사용량을 두 배로 쓰고, 뒤 실행의
# push 가 non-fast-forward 로 거부돼 실제 생성 실패와 구분되지 않는 빨간 run 이 남는다.
concurrency:
  group: summarize
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 판정·영역 두 단계가 같은 안내를 받도록 job 에 한 번 둔다. 저장소 CLAUDE.md 가 자동으로
      # 실린다 — 그 안의 승인 게이트·브랜치 확인·Serena 탐색 규칙은 사람이 앉아 있는 세션을
      # 전제하므로, 무인 실행이라는 사실을 여기서 명시해 무력화한다.
      CI_NOTE: |

        이 실행은 무인 CI 다 — 승인을 물을 상대가 없다. 저장소 CLAUDE.md 의 승인 게이트·
        브랜치 확인·Serena 탐색 규칙은 이 실행에 적용하지 않고, 출력 파일 쓰기를 바로 수행한다.
    steps:
      - uses: actions/checkout@v6

      - name: Extract source items
        run: python3 scripts/build.py extract

      # 이미 판정된 버전은 다시 묻지 않는다 — 재현성과 사용량 양쪽에 걸린다.
      - name: Collect unjudged releases
        id: pending
        run: python3 scripts/build.py pending --split-dir data/pending

      # 판정·영역 둘 다 할 일이 없으면 아래 전부를 건너뛴다. 빈 판정을 묻는 것은 사용량만 쓰고 아무것도
      # 바꾸지 않는다. 설치도 그 가드 뒤에 둔다 — 할 일이 없는 날에는 내려받지도 않는다.
      - name: Install Claude Code
        if: steps.pending.outputs.count != '0' || steps.pending.outputs.untagged != '0'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 판정이 죽어도 이 job 을 멈추지 않는다 — 이미 나온 판정분까지 함께 버리면 정체가 생기고,
      # 원본 atom 이 9일 창이라 그 사이 릴리스가 사라진다. 대신 이 step 은 빨강으로
      # 남고, 마지막 게이트가 그 outcome 을 다시 본다.
      #
      # **릴리스마다 한 번씩 부른다** — 통짜로 맡기면 `Write` 누적 재작성으로 턴이 소진된다.
      - name: Classify and translate
        id: classify
        if: steps.pending.outputs.count != '0'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: scripts/classify-all.sh data/pending data/judged

      # 병합이 판정 결과를 pending 과 대조해 통과분만 넣고, 어긋난 릴리스는 거부 수로 돌려준다.
      # 그 신호는 커밋을 마친 뒤에 쓴다 — 통과분까지 함께 버리지 않기 위해서다.
      - name: Merge and validate
        id: merge
        if: steps.pending.outputs.count != '0'
        run: |
          python3 scripts/build.py merge --judged-dir data/judged
          python3 scripts/build.py validate data/summaries.json

      # **판정 결과는 영역 단계 앞에서 커밋한다** — 한 커밋으로 묶으면 영역 단계가 실패하거나 job 이
      # 시간 제한에 걸릴 때 이미 병합한 판정분까지 함께 버려지고, 다음 실행이 같은 릴리스를 다시 판정한다.
      # 커밋을 나누면 영역 단계가 잃을 수 있는 것은 자기 몫(다음 실행이 다시 묻는다)뿐이다.
      - name: Commit summaries
        if: steps.pending.outputs.count != '0'
        env:
          MERGED: ${{ steps.merge.outputs.merged }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/summaries.json
          git diff --cached --quiet || git commit -m "chore: update release summaries (${MERGED})"
          # 겹친 실행이 먼저 밀어 넣었을 수 있다 — 거부되면 이 실행의 판정이 통째로 버려진다.
          git pull --rebase
          git push

      # 영역은 판정과 호출을 나눠 따로 묻는다 — 한 프롬프트에 합치면 영역 표가 impact 판정에 섞였다.
      # 대상은 새 릴리스가 아니라 영역이 없는 릴리스 전부다. 한 번 실패해도 영역이 없는 동안 다음 실행이
      # 다시 묻는다. 한 실행에 묻는 수는 상한을 둬 사용량을 묶는다.
      - name: Collect untagged releases
        id: area_pending
        if: steps.pending.outputs.count != '0' || steps.pending.outputs.untagged != '0'
        run: python3 scripts/build.py area-pending --limit 8

      # 실행 시간은 개수가 아니라 이 제한이 묶는다 — 릴리스마다 항목 수가 0~170여 개로 갈려 상한 8 의
      # 소요가 고정되지 않는다. 제한에 걸리면 그때까지 나온 영역만 붙고 나머지는 다음 실행이 다시 묻는다
      # (job 제한에 걸리면 붙이기까지 통째로 버려져 큰 릴리스가 앞에 있는 동안 진척이 없다).
      - name: Tag areas
        id: area
        if: steps.area_pending.outputs.count != '' && steps.area_pending.outputs.count != '0'
        continue-on-error: true
        timeout-minutes: 20
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: scripts/area-all.sh data/area-pending data/areas

      - name: Attach areas
        id: attach
        if: steps.area_pending.outputs.count != '' && steps.area_pending.outputs.count != '0'
        run: |
          python3 scripts/build.py attach-area
          python3 scripts/build.py validate data/summaries.json

      - name: Commit areas
        if: steps.area_pending.outputs.count != '' && steps.area_pending.outputs.count != '0'
        env:
          TAGGED: ${{ steps.attach.outputs.tagged }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/summaries.json
          git diff --cached --quiet || git commit -m "chore: tag release areas (${TAGGED})"
          git pull --rebase
          git push

      # 거부된 릴리스가 있거나 판정 자체가 실패했으면 여기서 끝을 빨강으로 만든다. 통과분은 이미
      # 들어갔고, 실패한 run 이 저자에게 가는 유일한 신호다 — 사용자 화면의 침묵과 저자의 관측은
      # 분리한다. 판정 실패를 따로 보는 이유는 그것이 거부 수에 안 잡히는 경우가 있어서다.
      - name: Fail on classify or area failure or rejected releases
        if: >-
          steps.classify.outcome == 'failure' || steps.area.outcome == 'failure' || (steps.merge.outputs.rejected != '' && steps.merge.outputs.rejected != '0') || (steps.attach.outputs.missing != '' && steps.attach.outputs.missing != '0')
        run: |
          echo "판정이 실패했거나 거부된 릴리스·영역을 못 붙인 릴리스가 있다 — 위 Classify·Merge·Tag areas·Attach areas 단계 로그를 볼 것" >&2
          exit 1

  # 생성이 멈춘 것을 저자에게 이슈로 알린다 — 판정은 scripts/watch-pipeline.sh 가 갖는다.
  # 요약 job 이 실패해도 돌아야 하므로 always() 이고, 권한은 이 job 에만 이슈 쓰기를 준다.
  # 예약 실행 자체가 안 도는 멈춤은 여기서 못 잡는다(이 job 도 함께 멈춘다) — 저장소 밖에서 본다.
  watch:
    needs: summarize
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # 요약 job 이 방금 push 한 커밋까지 보려면 트리거 시점 커밋이 아니라 브랜치 끝을 받는다.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Watch pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ inputs.simulate == 'failure' && 'failure' || needs.summarize.result }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/watch-pipeline.sh
